services:
  postgres:
    image: postgres:latest
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  migrator: &migrator
    image: migrate/migrate:4
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations:ro
    env_file: .env
    command:
      - "-path=/migrations"
      - "-database=postgresql://postgres:postgres@postgres:5432/postgres?sslmode=disable"
      - "up"
    restart: on-failure

  app: &app
    image: maxtet1703/pr-assignment-service:latest
    ports:
      - "8080:8080"
    depends_on:
      migrator:
        condition: service_completed_successfully


volumes:
  pgdata:
