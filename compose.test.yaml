version: '3.8'

services:
  postgres_test:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - pgtestdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 60s

  migrator_test:
    image: migrate/migrate:4
    depends_on:
      postgres_test:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations
    command:
      - "-path=/migrations"
      - "-database=postgresql://postgres:postgres@postgres_test:5432/postgres?sslmode=disable"
      - "up"
    restart: "no"

  app:
    image: maxtet1703/pr-assignment-service:latest
    ports:
      - "8080:8080"
    environment:
      ENVIRONMENT: testing
    depends_on:
      postgres_test:
        condition: service_healthy
      migrator_test:
        condition: service_completed_successfully

volumes:
  pgtestdata:
