services:
  postgres_test:
    image: postgres:latest
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - pgtestdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  migrator_test: &migrator
    image: migrate/migrate:4
    depends_on:
      postgres_test:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations:ro
    env_file: .env
    command: ["-path=/migrations", "-database=postgresql://postgres:postgres@postgres_test:5432/postgres?sslmode=disable", "up"]
    restart: on-failure

  app: &app
    image: maxtet1703/pr-assignment-service:latest
    ports:
      - "8080:8080"
    environment:
      ENVIRONMENT: testing
    depends_on:
      migrator_test:
        condition: service_completed_successfully


volumes:
  pgtestdata:
